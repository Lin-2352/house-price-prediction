services:
  - type: web
    name: house-price-estimator-india
    env: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
    healthCheckPath: /api/schema
